name: 每日数据更新与部署

on:
  schedule:
    # 北京时间每日 18:00（A股收盘后）= UTC 10:00
    - cron: '0 10 * * 1-5'  # 周一到周五
  workflow_dispatch:  # 支持手动触发

permissions:
  contents: write  # 允许提交数据回仓库

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: 更新股票列表
        run: python3 scripts/fetch_stocks.py

      - name: 增量拉取股价
        run: python3 scripts/fetch_prices.py --workers 12
        env:
          PYTHONUNBUFFERED: 1

      - name: 计算因子
        run: python3 scripts/compute_factors.py

      - name: 生成 index.html
        run: python3 scripts/build_html.py

      - name: 验证生成结果
        run: |
          ls -lh index.html
          echo "股票数量: $(python3 -c "import json; print(len(json.load(open('data/stocks.json'))))")"
          echo "因子数量: $(python3 -c "import json; print(len(json.load(open('data/factors.json'))))")"

      - name: 提交数据回仓库（增量更新）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/stocks.json data/prices.json data/factors.json
          if git diff --cached --quiet; then
            echo "无数据变更，跳过提交"
          else
            git commit -m "chore: 每日数据更新 $(date +%Y-%m-%d)"
            git push
          fi

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装 hsk-cli
        run: |
          npm install -g @aweray/hsk-cli
          hsk-cli --version
          hsk-cli update

      - name: 配置 hsk-cli API Key
        run: |
          mkdir -p ~/.hsk
          echo '{"api_key":"${{ secrets.HSK_API_KEY }}","scene":"file_hosting"}' > ~/.hsk/api_key.json

      - name: 推送到文件托管
        run: |
          # 推送 index.html（单文件）
          hsk-cli +host index.html --entry-file index.html --format json
        env:
          HSK_API_KEY: ${{ secrets.HSK_API_KEY }}
